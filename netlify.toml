# cipher — Netlify-Konfiguration
#
# Die Seite ist statisch: kein Build-Schritt, das Repo-Wurzelverzeichnis wird
# direkt ausgeliefert. `tools/serve.js` liest die Header unten ebenfalls ein,
# damit die Browsertests gegen dieselben Vorgaben laufen wie die Produktion.

[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------- Alle Seiten

[[headers]]
  for = "/*"
  [headers.values]
    # cipher lädt nichts von Dritten. Der CSP macht aus diesem Versprechen
    # eine Zusicherung, die der Browser durchsetzt:
    #   connect-src 'none'  verbietet jede fetch-, XHR- und Beacon-Anfrage
    #   default-src 'self'  lässt nur Dateien von dieser Domain zu
    #   script-src          nur eigene Dateien plus der eine Inline-Block, der
    #                       das Theme vor dem ersten Frame setzt (per Hash)
    #   style-src 'self'    ohne 'unsafe-inline': Platzfarben laufen über
    #                       Klassen, Balkenbreiten setzt JS über element.style —
    #                       das zählt für den CSP nicht als Inline-Stil
    #   img-src data:       für das Favicon, das als Daten-URI im HTML steckt
    #                       (favicon.ico und apple-touch-icon.png kommen über
    #                       'self' — sie liegen für Crawler und iOS bereit)
    Content-Security-Policy = "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self' 'sha256-0/SnVz+1HWAyp8RspSUcuLCetxO3rTo+AcltHVaRfyQ='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'"
    # Netlify erzwingt HTTPS nur per Weiterleitung. HSTS lässt den Browser gar
    # nicht erst über http anfragen — ein Jahr lang, samt Unterdomänen.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # Keine dieser Schnittstellen wird gebraucht — also gar nicht erst erlauben.
    # (interest-cohort stand hier einmal; FLoC gibt es nicht mehr, und Chrome
    # meldete das unbekannte Feature bei jedem Aufruf als Fehler.)
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"

# ------------------------------------------------- Schriften: lange Haltbarkeit

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --------------------------------------- Auslieferung: was nicht mit muss

# Testdateien und Werkzeuge gehören nicht auf die Website.
#
# `force = true` ist hier der entscheidende Teil. Netlify wendet eine Regel
# sonst nicht an, wenn unter dem Pfad eine Datei liegt — und genau das ist
# bei diesen Pfaden der Fall, weil `publish = "."` das ganze Repo ausliefert.
# Ohne force wären der Importer und die Tests live abrufbar gewesen.
[[redirects]]
  from = "/test/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

# ------------------------------------------------------ Icons auf Verdacht

# iOS fragt neben /apple-touch-icon.png auch die "precomposed"-Variante ab.
# Eine zweite, identische Datei braucht es dafür nicht: Status 200 liefert
# dieselbe PNG unter dem alten Namen aus, ohne Weiterleitung.
[[redirects]]
  from = "/apple-touch-icon-precomposed.png"
  to = "/apple-touch-icon.png"
  status = 200
